<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>微信</title>
<style>
/* ============ 全局重置 ============ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;overflow:hidden;}
body{background:#ededed;display:flex;align-items:center;justify-content:center;}

/* ============ 手机容器 ============ */
.phone{
  position:relative;width:100%;max-width:420px;height:100vh;max-height:900px;
  background:#ededed;display:flex;flex-direction:column;overflow:hidden;
}
@media (min-width:480px){
  .phone{border-radius:40px;overflow:hidden;height:90vh;box-shadow:0 20px 60px rgba(0,0,0,0.3);}
  body{padding:16px;}
}

/* ============ 状态栏 ============ */
.status-bar{flex-shrink:0;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:#ededed;font-size:15px;font-weight:600;color:#000;}
.status-bar .right{display:flex;align-items:center;gap:5px;font-size:13px;}
.status-bar .icons{display:flex;gap:4px;align-items:center;}
.signal{display:flex;align-items:flex-end;gap:1px;height:11px;}
.signal i{width:3px;background:#000;border-radius:1px;}
.signal i:nth-child(1){height:3px;}.signal i:nth-child(2){height:5px;}.signal i:nth-child(3){height:7px;}.signal i:nth-child(4){height:9px;}
.wifi{width:15px;height:11px;position:relative;}
.wifi::before{content:"";position:absolute;inset:0;border:2px solid #000;border-top:none;border-radius:0 0 50% 50%;clip-path:polygon(0 0,100% 0,100% 60%,0 60%);}
.battery{width:24px;height:11px;border:1px solid #000;border-radius:3px;position:relative;padding:1px;}
.battery::after{content:"";position:absolute;right:-3px;top:3px;width:2px;height:5px;background:#000;border-radius:0 2px 2px 0;}
.battery i{display:block;height:100%;width:90%;background:#000;border-radius:1px;}

/* ============ 导航栏 ============ */
.nav{flex-shrink:0;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#ededed;}
.nav .title{font-size:17px;font-weight:600;color:#000;}
.nav .actions{display:flex;gap:22px;font-size:22px;color:#000;}
.nav .actions span{cursor:pointer;}

/* ============ 页面容器 ============ */
.pages{flex:1;overflow:hidden;position:relative;background:#ededed;}
.page{position:absolute;inset:0;overflow-y:auto;display:none;background:#ededed;}
.page.active{display:block;}
.page::-webkit-scrollbar{width:0;}

/* ============ 通用列表单元 ============ */
.cell{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#fff;border-bottom:0.5px solid #e5e5e5;cursor:pointer;}
.cell:active{background:#ececec;}
.cell .ic-box{width:40px;height:40px;border-radius:8px;flex-shrink:0;display:grid;place-items:center;font-size:20px;color:#fff;}
.cell .nm{flex:1;font-size:16px;color:#111;}
.cell .arr{color:#c7c7cc;font-size:20px;line-height:1;}
.group-gap{height:10px;background:#ededed;}
.letter-bar{background:#ededed;padding:4px 14px;font-size:13px;color:#888;font-weight:500;}

/* ============ 微信聊天列表 ============ */
.search-bar{padding:6px 14px;background:#ededed;}
.search-bar .inner{height:34px;background:#fff;border-radius:6px;display:flex;align-items:center;justify-content:center;gap:5px;color:#999;font-size:14px;}
.session{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#fff;border-bottom:0.5px solid #e5e5e5;cursor:pointer;}
.session:active{background:#ececec;}
.avatar-wrap{position:relative;flex-shrink:0;}
.avatar{width:48px;height:48px;border-radius:6px;display:grid;place-items:center;font-size:22px;overflow:hidden;}
.avatar img,.contact-ava img,.gi-ava img{width:100%;height:100%;object-fit:cover;display:block;}
.red-dot{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;background:#fa5151;color:#fff;font-size:11px;border-radius:9px;display:grid;place-items:center;padding:0 5px;border:2px solid #fff;}
.session-main{flex:1;min-width:0;}
.session-top{display:flex;justify-content:space-between;align-items:baseline;}
.session-name{font-size:16px;color:#000;font-weight:500;}
.session-time{font-size:12px;color:#999;flex-shrink:0;margin-left:8px;}
.session-sub{font-size:13px;color:#999;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* ============ 通讯录 ============ */
.contacts-list .cell{padding:8px 14px;}
.contacts-list .cell .ic-box{width:40px;height:40px;border-radius:4px;}
.contacts-list .cell .nm{font-size:16px;color:#181818;font-weight:400;}
.contact-ava{width:40px;height:40px;border-radius:4px;flex-shrink:0;display:grid;place-items:center;font-size:20px;overflow:hidden;}

/* ============ 发现 ============ */
.discover-list .cell{padding:12px 14px;}

/* ============ 我 ============ */
.me-header{display:flex;align-items:center;gap:12px;padding:18px 14px;background:#fff;border-bottom:0.5px solid #e5e5e5;}
.me-avatar{width:60px;height:60px;border-radius:8px;flex-shrink:0;display:grid;place-items:center;font-size:30px;background:#cfe3ff;overflow:hidden;}
.me-avatar img{width:100%;height:100%;object-fit:cover;}
.me-info{flex:1;}
.me-name{font-size:19px;font-weight:600;color:#111;}
.me-id{font-size:13px;color:#888;margin-top:4px;}
.me-right{display:flex;align-items:center;gap:6px;color:#c7c7cc;font-size:20px;}
/* 状态按钮 */
.me-status{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#fff;border-bottom:0.5px solid #e5e5e5;}
.me-status .status-btn{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;border:1px solid #e0e0e0;border-radius:14px;font-size:13px;color:#666;}
.me-status .status-circle{width:22px;height:22px;border-radius:50%;border:1.5px solid #ccc;display:grid;place-items:center;font-size:12px;color:#999;}

/* ============ 底部Tab栏 ============ */
.tabbar{flex-shrink:0;display:flex;background:#f7f7f7;border-top:0.5px solid #d9d9d9;padding:6px 0;padding-bottom:calc(6px + env(safe-area-inset-bottom));}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;color:#7a7a7a;font-size:10px;position:relative;}
.tab .ic{width:25px;height:25px;display:block;line-height:0;}
.tab .ic svg{width:100%;height:100%;display:block;}
.tab.active{color:#07c160;}

/* ============ 聊天详情页（覆盖层） ============ */
.chat-detail{
  position:absolute;inset:0;background:#ededed;z-index:10;
  display:none;flex-direction:column;
}
.chat-detail.show{display:flex;}
/* 聊天导航栏 */
.chat-nav{
  flex-shrink:0;height:44px;background:#ededed;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 10px;border-bottom:0.5px solid #d9d9d9;
}
.chat-nav .back{font-size:22px;color:#000;cursor:pointer;padding:0 6px;}
.chat-nav .chat-title{font-size:16px;font-weight:600;color:#000;flex:1;text-align:center;}
.chat-nav .more{font-size:20px;color:#000;cursor:pointer;padding:0 6px;}
/* 消息区 */
.chat-body{flex:1;overflow-y:auto;padding:10px 12px;background:#ededed;}
.chat-body::-webkit-scrollbar{width:0;}
.msg-time{text-align:center;font-size:12px;color:#999;margin:8px 0;}
.msg-row{display:flex;gap:8px;margin-bottom:12px;align-items:flex-start;}
.msg-row.me{flex-direction:row-reverse;}
.msg-avatar{width:36px;height:36px;border-radius:5px;flex-shrink:0;display:grid;place-items:center;font-size:18px;overflow:hidden;}
.msg-avatar img{width:100%;height:100%;object-fit:cover;}
.msg-bubble{max-width:70%;padding:9px 12px;border-radius:6px;font-size:15px;line-height:1.4;word-break:break-word;position:relative;}
.msg-row.other .msg-bubble{background:#fff;color:#111;}
.msg-row.me .msg-bubble{background:#95ec69;color:#000;}
/* 气泡尖角 */
.msg-row.other .msg-bubble::before{content:"";position:absolute;left:-6px;top:12px;width:0;height:0;border:6px solid transparent;border-right-color:#fff;border-left:0;}
.msg-row.me .msg-bubble::before{content:"";position:absolute;right:-6px;top:12px;width:0;height:0;border:6px solid transparent;border-left-color:#95ec69;border-right:0;}
.msg-sender{font-size:12px;color:#888;margin-bottom:2px;}
/* 输入栏 */
.chat-input{flex-shrink:0;display:flex;align-items:center;gap:8px;padding:7px 10px;background:#f7f7f7;border-top:0.5px solid #d9d9d9;}
.chat-input .voice,.chat-input .emo,.chat-input .plus{font-size:22px;color:#333;width:30px;text-align:center;cursor:pointer;}
.chat-input input{flex:1;height:34px;border:none;border-radius:6px;padding:0 10px;font-size:15px;background:#fff;outline:none;}
.chat-input .send-btn{background:#07c160;color:#fff;border:none;border-radius:6px;padding:7px 14px;font-size:14px;cursor:pointer;display:none;}

/* ============ 群聊信息页 ============ */
.group-info{position:absolute;inset:0;background:#ededed;z-index:20;display:none;flex-direction:column;}
.group-info.show{display:flex;}
.gi-body{flex:1;overflow-y:auto;}
.gi-members{display:flex;flex-wrap:wrap;gap:14px;padding:14px;background:#fff;}
.gi-m{width:52px;text-align:center;}
.gi-m .gi-ava{width:48px;height:48px;border-radius:6px;display:grid;place-items:center;font-size:22px;margin:0 auto 4px;overflow:hidden;}

.gi-cell{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:#fff;border-bottom:0.5px solid #e5e5e5;font-size:15px;}
.gi-cell .lbl{color:#111;}
.gi-cell .val{color:#999;font-size:14px;}
</style>
</head>

/* ==================== 头像渲染辅助 ==================== */
// 有img用图片，否则用emoji
function avaInner(obj){
  if(obj.img){ return `<img src="${obj.img}" alt="">`; }
  return obj.avatar;
}

/* ==================== 渲染微信聊天列表 ==================== */
function renderWechatList(){
  const box = document.getElementById('pageWechat');
  let html = '';
  // 公众号固定项
  html += `<div class="session">
    <div class="avatar-wrap">
      <div class="avatar" style="background:#3f7bef;">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <path d="M14 3 L24 7 V17 C24 21 19 24 14 25 C9 24 4 21 4 17 V7 Z" fill="#fff"/>
          <path d="M14 7 L20 9.2 V16.8 C20 19.2 17.3 21.3 14 22.2 C10.7 21.3 8 19.2 8 16.8 V9.2 Z" fill="#3f7bef"/>
          <path d="M14 9.5 L17.5 10.8 V16.2 C17.5 17.8 15.9 19.1 14 19.7 C12.1 19.1 10.5 17.8 10.5 16.2 V10.8 Z" fill="#fff"/>
        </svg>
      </div>
      <span class="red-dot"></span>
    </div>
    <div class="session-main">
      <div class="session-top"><span class="session-name">公众号</span><span class="session-time">昨天</span></div>
      <div class="session-sub">快讯：一诺状态 热搜第一，卫冕冠军AG止步KPL...</div>
    </div>
  </div>`;
  // 群聊 + 好友
  for(const id in chats){
    const c = chats[id];
    const dot = c.unread > 0 ? `<span class="red-dot">${c.unread}</span>` : '';
    html += `<div class="session" onclick="openChat('${id}')">
      <div class="avatar-wrap">
        <div class="avatar" style="background:${c.bg};">${avaInner(c)}</div>
        ${dot}
      </div>
      <div class="session-main">
        <div class="session-top"><span class="session-name">${c.name}</span><span class="session-time">${c.time}</span></div>
        <div class="session-sub">${c.last}</div>
      </div>
    </div>`;
  }
  box.innerHTML = html;
}

/* ==================== 渲染通讯录 ==================== */
function renderContacts(){
  const box = document.getElementById('pageContacts');
  let html = '<div class="search-bar"><div class="inner">🔍 搜索</div></div><div class="contacts-list">';
  // 顶部快捷入口
  html += `<div class="cell"><div class="ic-box" style="background:#fa9f3c;">👋</div><span class="nm">新的朋友</span><span class="arr">›</span></div>`;
  html += `<div class="cell"><div class="ic-box" style="background:#4787ee;">👥</div><span class="nm">群聊</span><span class="arr">›</span></div>`;
  html += `<div class="cell"><div class="ic-box" style="background:#f2b23c;">🏷️</div><span class="nm">标签</span><span class="arr">›</span></div>`;
  html += `<div class="cell"><div class="ic-box" style="background:#3f7bef;">📘</div><span class="nm">公众号</span><span class="arr">›</span></div>`;
  // 按首字母分组
  const groups = {};
  friends.forEach(f => {
    const letter = f.name[0].toUpperCase();
    // 简单按拼音首字母分组：牢L, kK, 大D, 陈C, 哥G
    const map = {'牢':'L','k':'K','大':'D','陈':'C','哥':'G','到':'D'};
    const key = map[f.name[0]] || '#';
    if(!groups[key]) groups[key] = [];
    groups[key].push(f);
  });
  Object.keys(groups).sort().forEach(letter => {
    html += `<div class="letter-bar">${letter}</div>`;
    groups[letter].forEach(f => {
      html += `<div class="cell" onclick="openChat('${f.id}')">
        <div class="contact-ava" style="background:${f.bg};">${avaInner(f)}</div>
        <span class="nm">${f.name}</span><span class="arr">›</span>
      </div>`;
    });
  });
  html += '</div>';
  box.innerHTML = html;
}

/* ==================== 打开聊天 ==================== */
let currentChatId = null;
function openChat(id){
  const c = chats[id];
  if(!c) return;
  currentChatId = id;
  // 清未读
  c.unread = 0;
  renderWechatList();
  // 标题
  document.getElementById('chatTitle').textContent = c.name;
  // 消息
  const body = document.getElementById('chatBody');
  let html = `<div class="msg-time">${c.messages[0].time}</div>`;
  c.messages.forEach((m,i) => {
    const isMe = m.sender === 'me';
    let avaObj;
    if(isMe){ avaObj = ME; }
    else if(c.type === 'group'){ avaObj = c.members.find(mb => mb.name === m.sender) || {avatar:'❓', bg:'#ccc'}; }
    else { avaObj = c; }
    const avaHtml = isMe ? `<img src="avatar-cat.jpg">` : avaInner(avaObj);
    const avaStyle = isMe ? '' : ` style="background:${avaObj.bg};"`;
    const name = c.type==='group' && !isMe ? `<div class="msg-sender">${m.sender}</div>` : '';
    html += `<div class="msg-row ${isMe?'me':'other'}">
      <div class="msg-avatar"${avaStyle}>${avaHtml}</div>
      <div>
        ${name}
        <div class="msg-bubble">${m.text}</div>
      </div>
    </div>`;
  });
  body.innerHTML = html;
  body.scrollTop = body.scrollHeight;
  // 输入框placeholder
  document.getElementById('chatInput').placeholder = '';
  document.getElementById('chatDetail').classList.add('show');
}

function closeChat(){
  document.getElementById('chatDetail').classList.remove('show');
  currentChatId = null;
}

/* ==================== 发送消息 ==================== */
function toggleSend(input){
  document.getElementById('sendBtn').style.display = input.value.trim() ? 'block' : 'none';
  document.getElementById('plusBtn').style.display = input.value.trim() ? 'none' : 'block';
}
function sendMsg(){
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if(!text || !currentChatId) return;
  const c = chats[currentChatId];
  c.messages.push({time:'刚刚', sender:'me', text});
  // 更新列表last
  c.last = text;
  c.time = '刚刚';
  // 重新渲染当前聊天
  openChat(currentChatId);
  input.value = '';
  toggleSend(input);
  // 模拟对方回复
  setTimeout(() => {
    if(c.type === 'single'){
      c.messages.push({time:'刚刚', sender:c.name, text:'嗯，收到'});
    } else {
      const m = c.members[Math.floor(Math.random()*c.members.length)];
      c.messages.push({time:'刚刚', sender:m.name, text:'哈哈'});
    }
    if(currentChatId) openChat(currentChatId);
  }, 800);
}

/* ==================== 群聊信息页 ==================== */
function openGroupInfo(){
  const c = chats[currentChatId];
  if(!c || c.type !== 'group') return;
  const body = document.getElementById('giBody');
  let html = `<div class="gi-members">`;
  c.members.forEach(m => {
    html += `<div class="gi-m"><div class="gi-ava" style="background:${m.bg};">${avaInner(m)}</div><div class="gi-name">${m.name}</div></div>`;
  });
  html += `</div>`;
  html += `<div class="gi-cell"><span class="lbl">群聊名称</span><span class="val">${c.name} ›</span></div>`;
  html += `<div class="gi-cell"><span class="lbl">群公告</span><span class="val">未设置 ›</span></div>`;
  html += `<div class="gi-cell"><span class="lbl">我在本群的昵称</span><span class="val">${ME.name} ›</span></div>`;
  body.innerHTML = html;
  document.getElementById('groupInfo').classList.add('show');
}
function closeGroupInfo(){
  document.getElementById('groupInfo').classList.remove('show');
}

/* ==================== Tab 切换 ==================== */
const tabs = document.querySelectorAll('.tab');
const pages = document.querySelectorAll('.page');
const navTitle = document.getElementById('navTitle');
const titles = {wechat:'微信', contacts:'通讯录', discover:'发现', me:'我'};
tabs.forEach(tab => {
  tab.addEventListener('click', () => {
    const name = tab.dataset.tab;
    tabs.forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    pages.forEach(p => p.classList.toggle('active', p.dataset.page === name));
    navTitle.textContent = titles[name] || '微信';
    // 关闭可能打开的聊天详情
    closeChat();
    closeGroupInfo();
  });
});

/* ==================== 初始化 ==================== */
renderWechatList();
renderContacts();
</script>
