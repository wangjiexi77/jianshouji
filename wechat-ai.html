<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- 移动端适配：禁止用户缩放，宽度=设备宽度 -->
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>微信 · AI 聊天</title>
<style>
/* ============ 全局重置 ============ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;overflow:hidden;}
body{
  /* 深色极简氛围背景，渐变营造通透光影 */
  background:radial-gradient(circle at 20% 10%,#2a1f3d 0%,#161320 45%,#0c0a14 100%);
  display:flex;align-items:center;justify-content:center;
}

/* ============ 手机容器：iOS 大圆角 + 磨砂玻璃外框 ============ */
.phone{
  position:relative;
  width:100%;max-width:420px;height:100vh;max-height:900px;
  background:rgba(20,18,30,0.85);
  backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);
  border:1px solid rgba(255,255,255,0.08);
  box-shadow:0 30px 80px rgba(0,0,0,0.6),0 10px 30px rgba(0,0,0,0.4),inset 0 1px 0 rgba(255,255,255,0.06);
  display:flex;flex-direction:column;
  overflow:hidden;
}
/* 桌面端才显示手机外圆角；移动端全屏无边框 */
@media (min-width:480px){
  .phone{border-radius:44px;height:90vh;}
  body{padding:16px;}
}

/* ============ 顶部导航栏 ============ */
.nav{
  flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));
  background:rgba(20,18,30,0.72);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-bottom:1px solid rgba(255,255,255,0.06);
  z-index:20;
}
.nav .back,.nav .more{
  font-size:24px;color:#e8e8ec;width:36px;height:36px;
  display:grid;place-items:center;cursor:pointer;border-radius:50%;
  transition:background .2s;
}
.nav .back:active,.nav .more:active{background:rgba(255,255,255,0.1);}
.nav .title{
  font-size:17px;font-weight:600;color:#f5f5f7;text-align:center;flex:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px;
}
.nav .title small{display:block;font-size:11px;color:#9a9aa0;font-weight:400;}

/* ============ 聊天区域（可滚动） ============ */
.chat{
  flex:1;overflow-y:auto;overflow-x:hidden;
  padding:16px 14px 8px;
  display:flex;flex-direction:column;gap:10px;
  scroll-behavior:smooth;
  -webkit-overflow-scrolling:touch;
}
/* 时间戳 */
.msg-time{
  text-align:center;font-size:11px;color:#9a9aa0;
  background:rgba(0,0,0,0.25);backdrop-filter:blur(8px);
  padding:3px 10px;border-radius:10px;align-self:center;
  margin:4px 0;
}

/* 单条消息 */
.msg{
  display:flex;gap:8px;max-width:85%;
  animation:msgIn .32s cubic-bezier(.2,.8,.2,1);
}
.msg.self{align-self:flex-end;flex-direction:row-reverse;}
.msg.other{align-self:flex-start;}

/* 气泡头像 */
.avatar{
  width:38px;height:38px;border-radius:10px;
  object-fit:cover;flex-shrink:0;
  box-shadow:0 2px 8px rgba(0,0,0,0.3);
  background:rgba(255,255,255,0.1);
}
.avatar.fallback{
  display:grid;place-items:center;font-size:18px;color:#fff;
  background:linear-gradient(135deg,#667eea,#764ba2);
}

/* 气泡 */
.bubble{
  position:relative;
  padding:10px 14px;border-radius:18px;
  font-size:15px;line-height:1.5;word-break:break-word;white-space:pre-wrap;
  box-shadow:0 4px 14px rgba(0,0,0,0.25);
}
/* 对方白色气泡（深色环境下用透明白） */
.msg.other .bubble{
  background:rgba(255,255,255,0.92);color:#1a1a1a;
  border-top-left-radius:4px;
}
/* 我方微信绿气泡 */
.msg.self .bubble{
  background:linear-gradient(135deg,#3dd17a,#07c160);color:#fff;
  border-top-right-radius:4px;
}

/* 消息入场动画 */
@keyframes msgIn{
  from{opacity:0;transform:translateY(12px) scale(.96);}
  to{opacity:1;transform:translateY(0) scale(1);}
}

/* ============ 正在输入动画 ============ */
.typing{
  display:inline-flex;gap:4px;align-items:center;padding:4px 2px;
}
.typing span{
  width:7px;height:7px;border-radius:50%;background:#8a8a90;
  animation:typingBounce 1.2s infinite ease-in-out;
}
.typing span:nth-child(2){animation-delay:.2s;}
.typing span:nth-child(3){animation-delay:.4s;}
@keyframes typingBounce{
  0%,60%,100%{transform:translateY(0);opacity:.4;}
  30%{transform:translateY(-6px);opacity:1;}
}

/* ============ 底部输入栏 ============ */
.input-bar{
  flex-shrink:0;
  display:flex;align-items:flex-end;gap:8px;
  padding:10px 12px;padding-bottom:calc(10px + env(safe-area-inset-bottom));
  background:rgba(20,18,30,0.8);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-top:1px solid rgba(255,255,255,0.06);
}
.input-bar .icon-btn{
  width:36px;height:36px;border-radius:50%;
  display:grid;place-items:center;font-size:20px;color:#cfcfd4;cursor:pointer;
  flex-shrink:0;transition:background .2s;
}
.input-bar .icon-btn:active{background:rgba(255,255,255,0.1);}
#msgInput{
  flex:1;min-height:36px;max-height:110px;
  background:rgba(255,255,255,0.1);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:18px;padding:8px 14px;
  color:#f5f5f7;font-size:15px;line-height:1.4;
  resize:none;outline:none;
  backdrop-filter:blur(10px);
}
#msgInput::placeholder{color:#7a7a82;}
#sendBtn{
  background:linear-gradient(135deg,#3dd17a,#07c160);
  color:#fff;border:none;border-radius:18px;
  padding:0 16px;height:36px;font-size:14px;font-weight:600;
  cursor:pointer;flex-shrink:0;
  box-shadow:0 4px 12px rgba(7,193,96,0.35);
  transition:transform .15s;
}
#sendBtn:active{transform:scale(.94);}
#sendBtn:disabled{opacity:.45;box-shadow:none;cursor:not-allowed;}

/* ============ 设置面板（从右侧滑入） ============ */
.sheet-mask{
  position:absolute;inset:0;background:rgba(0,0,0,0.5);
  z-index:50;opacity:0;pointer-events:none;transition:opacity .3s;
}
.sheet-mask.show{opacity:1;pointer-events:auto;}
.sheet{
  position:absolute;top:0;right:0;height:100%;width:100%;max-width:360px;
  background:rgba(28,26,40,0.92);
  backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);
  border-left:1px solid rgba(255,255,255,0.08);
  transform:translateX(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1);
  z-index:60;display:flex;flex-direction:column;
  box-shadow:-10px 0 40px rgba(0,0,0,0.5);
}
.sheet.show{transform:translateX(0);}
.sheet-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 18px;padding-top:calc(16px + env(safe-area-inset-top));
  border-bottom:1px solid rgba(255,255,255,0.07);
}
.sheet-head h3{font-size:17px;color:#f5f5f7;font-weight:600;}
.sheet-close{font-size:24px;color:#cfcfd4;cursor:pointer;width:32px;height:32px;display:grid;place-items:center;}
.sheet-body{flex:1;overflow-y:auto;padding:16px 18px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:13px;color:#b8b8c0;margin-bottom:6px;}
.field input,.field textarea{
  width:100%;background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.08);border-radius:10px;
  padding:9px 12px;color:#f5f5f7;font-size:14px;outline:none;
  font-family:inherit;
}
.field input:focus,.field textarea:focus{border-color:rgba(7,193,96,0.5);}
.field textarea{min-height:70px;resize:vertical;}
.row2{display:flex;gap:10px;}
.row2 .field{flex:1;margin-bottom:0;}
/* 头像/背景预览 + 上传 */
.pick{display:flex;align-items:center;gap:10px;}
.pick .pv{
  width:48px;height:48px;border-radius:10px;overflow:hidden;
  background:rgba(255,255,255,0.08);display:grid;place-items:center;
  border:1px solid rgba(255,255,255,0.1);flex-shrink:0;
}
.pick .pv img{width:100%;height:100%;object-fit:cover;}
.pick input{flex:1;}
.bg-pv{
  height:60px;border-radius:10px;overflow:hidden;
  background-size:cover;background-position:center;
  border:1px solid rgba(255,255,255,0.1);margin-bottom:6px;
}
.sheet-foot{
  padding:14px 18px;padding-bottom:calc(14px + env(safe-area-inset-bottom));
  border-top:1px solid rgba(255,255,255,0.07);
  display:flex;gap:10px;
}
.sheet-foot button{
  flex:1;padding:11px 0;border-radius:10px;font-size:14px;font-weight:600;
  cursor:pointer;border:none;transition:opacity .2s;
}
.btn-primary{background:linear-gradient(135deg,#3dd17a,#07c160);color:#fff;}
.btn-danger{background:rgba(240,80,110,0.15);color:#ff6b7a;border:1px solid rgba(240,80,110,0.3);}
.sheet-foot button:active{opacity:.8;}

/* ============ 滚动条美化 ============ */
.chat::-webkit-scrollbar,.sheet-body::-webkit-scrollbar{width:0;}

/* ============ 加载提示（API调用失败等） ============ */
.toast{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  background:rgba(0,0,0,0.78);color:#fff;font-size:13px;
  padding:10px 18px;border-radius:10px;z-index:80;
  opacity:0;pointer-events:none;transition:opacity .3s;
  backdrop-filter:blur(10px);
}
.toast.show{opacity:1;}
</style>
</head>
<body>

<!-- ============ 手机容器 ============ -->
<div class="phone" id="phone">

  <!-- 顶部导航栏 -->
  <div class="nav">
    <span class="back" onclick="history.back()">‹</span>
    <div class="title" id="peerName">AI 助手<small id="peerStatus">在线</small></div>
    <span class="more" onclick="toggleSheet(true)">⋯</span>
  </div>

  <!-- 聊天滚动区 -->
  <div class="chat" id="chatBox"></div>

  <!-- 底部输入栏 -->
  <div class="input-bar">
    <span class="icon-btn" onclick="toggleSheet(true)">⚙️</span>
    <textarea id="msgInput" placeholder="说点什么…" rows="1"></textarea>
    <button id="sendBtn" onclick="sendMsg()">发送</button>
  </div>

  <!-- 设置面板 -->
  <div class="sheet-mask" id="sheetMask" onclick="toggleSheet(false)"></div>
  <div class="sheet" id="sheet">
    <div class="sheet-head">
      <h3>设置</h3>
      <span class="sheet-close" onclick="toggleSheet(false)">✕</span>
    </div>
    <div class="sheet-body">

      <div class="field">
        <label>对方昵称</label>
        <input id="cfgName" placeholder="AI 助手">
      </div>

      <div class="field">
        <label>AI 人设提示词（System Prompt）</label>
        <textarea id="cfgPrompt" placeholder="你是一个温柔、幽默的聊天助手..."></textarea>
      </div>

      <div class="row2">
        <div class="field">
          <label>对方头像（URL 或上传）</label>
          <div class="pick">
            <div class="pv" id="pvOther"><span style="color:#888;">🤖</span></div>
            <input id="cfgOtherAvatar" placeholder="https://...">
          </div>
          <input type="file" accept="image/*" id="fileOther" style="display:none" onchange="onFile(this,'cfgOtherAvatar','pvOther')">
          <button onclick="document.getElementById('fileOther').click()" style="margin-top:6px;background:rgba(255,255,255,0.06);color:#cfcfd4;border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer;">从相册选择</button>
        </div>
        <div class="field">
          <label>自己头像（URL 或上传）</label>
          <div class="pick">
            <div class="pv" id="pvSelf"><span style="color:#888;">🧑</span></div>
            <input id="cfgSelfAvatar" placeholder="https://...">
          </div>
          <input type="file" accept="image/*" id="fileSelf" style="display:none" onchange="onFile(this,'cfgSelfAvatar','pvSelf')">
          <button onclick="document.getElementById('fileSelf').click()" style="margin-top:6px;background:rgba(255,255,255,0.06);color:#cfcfd4;border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer;">从相册选择</button>
        </div>
      </div>

      <div class="field" style="margin-top:16px;">
        <label>聊天背景（URL 或上传）</label>
        <div class="bg-pv" id="pvBg"></div>
        <input id="cfgBg" placeholder="https://... 或留空使用默认深色背景">
        <input type="file" accept="image/*" id="fileBg" style="display:none" onchange="onFile(this,'cfgBg','pvBg')">
        <button onclick="document.getElementById('fileBg').click()" style="margin-top:6px;background:rgba(255,255,255,0.06);color:#cfcfd4;border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer;">从相册选择</button>
      </div>

      <div class="field" style="margin-top:16px;">
        <label>API 地址</label>
        <input id="cfgApi" placeholder="https://api.deepseek.com/chat/completions">
      </div>

      <div class="field">
        <label>API Key</label>
        <input id="cfgKey" type="password" placeholder="sk-...">
      </div>

      <div class="row2">
        <div class="field">
          <label>模型名称</label>
          <input id="cfgModel" placeholder="deepseek-chat">
        </div>
        <div class="field">
          <label>上下文记忆轮数</label>
          <input id="cfgMemory" type="number" min="1" placeholder="10">
        </div>
      </div>

    </div>
    <div class="sheet-foot">
      <button class="btn-danger" onclick="clearChat()">清空聊天</button>
      <button class="btn-primary" onclick="saveCfg()">保存设置</button>
    </div>
  </div>

  <!-- 轻提示 -->
  <div class="toast" id="toast"></div>

</div>

<script>
/* ============ 配置管理（localStorage 持久化） ============ */
const STORAGE_KEY = 'wechat_ai_chat_cfg';
const MSG_KEY = 'wechat_ai_chat_msgs';

// 默认配置
let cfg = {
  name:'AI 助手',
  prompt:'你是一个温柔、幽默、贴心的聊天助手，回复简洁自然，像朋友一样聊天。',
  otherAvatar:'',
  selfAvatar:'',
  bg:'',
  api:'https://api.deepseek.com/chat/completions',
  key:'',
  model:'deepseek-chat',
  memory:10
};

// 加载配置
function loadCfg(){
  try{
    const s = localStorage.getItem(STORAGE_KEY);
    if(s) cfg = {...cfg, ...JSON.parse(s)};
  }catch(e){console.warn('配置读取失败',e);}
}
// 保存配置
function saveCfg(){
  cfg.name = document.getElementById('cfgName').value.trim() || 'AI 助手';
  cfg.prompt = document.getElementById('cfgPrompt').value;
  cfg.otherAvatar = document.getElementById('cfgOtherAvatar').value.trim();
  cfg.selfAvatar = document.getElementById('cfgSelfAvatar').value.trim();
  cfg.bg = document.getElementById('cfgBg').value.trim();
  cfg.api = document.getElementById('cfgApi').value.trim();
  cfg.key = document.getElementById('cfgKey').value.trim();
  cfg.model = document.getElementById('cfgModel').value.trim() || 'deepseek-chat';
  cfg.memory = parseInt(document.getElementById('cfgMemory').value) || 10;
  localStorage.setItem(STORAGE_KEY, JSON.stringify(cfg));
  applyCfg();
  toggleSheet(false);
  showToast('设置已保存');
}
// 将配置应用到界面
function applyCfg(){
  document.getElementById('peerName').firstChild.textContent = cfg.name;
  document.getElementById('peerName').childNodes[0].textContent = cfg.name;
  document.title = '微信 · ' + cfg.name;
  // 背景
  const phone = document.getElementById('phone');
  if(cfg.bg){
    phone.style.backgroundImage = `linear-gradient(rgba(10,8,18,0.78),rgba(10,8,18,0.78)),url('${cfg.bg}')`;
    phone.style.backgroundSize = 'cover';
    phone.style.backgroundPosition = 'center';
  }else{
    phone.style.backgroundImage = '';
  }
}
// 把配置填入表单
function fillCfgForm(){
  document.getElementById('cfgName').value = cfg.name;
  document.getElementById('cfgPrompt').value = cfg.prompt;
  document.getElementById('cfgOtherAvatar').value = cfg.otherAvatar;
  document.getElementById('cfgSelfAvatar').value = cfg.selfAvatar;
  document.getElementById('cfgBg').value = cfg.bg;
  document.getElementById('cfgApi').value = cfg.api;
  document.getElementById('cfgKey').value = cfg.key;
  document.getElementById('cfgModel').value = cfg.model;
  document.getElementById('cfgMemory').value = cfg.memory;
  // 预览头像
  setPreview('pvOther', cfg.otherAvatar, '🤖');
  setPreview('pvSelf', cfg.selfAvatar, '🧑');
  const bg = document.getElementById('pvBg');
  bg.style.backgroundImage = cfg.bg ? `url('${cfg.bg}')` : '';
  // 聊天区头像占位会在渲染消息时使用
}
// 头像预览
function setPreview(id, src, fallback){
  const el = document.getElementById(id);
  el.innerHTML = src ? `<img src="${src}" onerror="this.parentElement.innerHTML='<span style=\\'color:#888\\'>${fallback}</span>'">` : `<span style="color:#888;">${fallback}</span>`;
}
// 本地图片上传 -> base64 填入对应输入框
function onFile(input, targetId, pvId){
  const f = input.files[0];
  if(!f) return;
  const reader = new FileReader();
  reader.onload = function(e){
    document.getElementById(targetId).value = e.target.result;
    if(pvId === 'pvBg'){
      document.getElementById(pvId).style.backgroundImage = `url('${e.target.result}')`;
    }else{
      document.getElementById(pvId).innerHTML = `<img src="${e.target.result}">`;
    }
  };
  reader.readAsDataURL(f);
}

/* ============ 设置面板开关 ============ */
function toggleSheet(open){
  document.getElementById('sheet').classList.toggle('show', open);
  document.getElementById('sheetMask').classList.toggle('show', open);
  if(open) fillCfgForm();
}

/* ============ Toast 提示 ============ */
let toastTimer;
function showToast(t){
  const el = document.getElementById('toast');
  el.textContent = t;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 1800);
}

/* ============ 聊天消息管理 ============ */
let messages = [];   // {role:'user'|'assistant', content, time}
let isAiTyping = false;

// 加载历史
function loadMsgs(){
  try{
    const s = localStorage.getItem(MSG_KEY);
    if(s) messages = JSON.parse(s);
  }catch(e){messages=[];}
}
function saveMsgs(){
  try{ localStorage.setItem(MSG_KEY, JSON.stringify(messages)); }catch(e){}
}
// 渲染全部消息
function renderAll(){
  const box = document.getElementById('chatBox');
  box.innerHTML = '';
  messages.forEach((m,i)=>{
    const prev = messages[i-1];
    // 与上一条间隔超过1分钟则显示时间戳
    if(!prev || (m.time - prev.time) > 60000){
      box.appendChild(timeTag(m.time));
    }
    box.appendChild(buildMsg(m));
  });
  scrollBottom();
}
// 时间戳标签
function timeTag(t){
  const d = new Date(t);
  const hh = String(d.getHours()).padStart(2,'0');
  const mm = String(d.getMinutes()).padStart(2,'0');
  const el = document.createElement('div');
  el.className = 'msg-time';
  el.textContent = `${hh}:${mm}`;
  return el;
}
// 头像元素
function avatarEl(role){
  const el = document.createElement('img');
  el.className = 'avatar';
  const src = role==='user' ? cfg.selfAvatar : cfg.otherAvatar;
  if(src){ el.src = src; }
  else{
    // 无头像时用占位
    el.classList.add('fallback');
    el.outerHTML = `<div class="avatar fallback">${role==='user'?'🧑':'🤖'}</div>`;
    return document.createElement('div'); // 占位，实际被替换
  }
  return el;
}
// 单条消息节点
function buildMsg(m){
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + (m.role==='user'?'self':'other');
  // 头像
  const av = document.createElement('img');
  av.className = 'avatar';
  const src = m.role==='user' ? cfg.selfAvatar : cfg.otherAvatar;
  if(src){ av.src = src; }
  else{ av.classList.add('fallback'); av.style.cssText='display:grid;place-items:center;font-size:18px;'; }
  if(!src) av.outerHTML = `<div class="avatar fallback" style="display:grid;place-items:center;font-size:18px;">${m.role==='user'?'🧑':'🤖'}</div>`;
  wrap.appendChild(document.querySelector('.avatar')?document.querySelector('.avatar').cloneNode():av);
  // 简化：直接用 outerHTML 方案重建
  wrap.innerHTML = '';
  const avStr = src ? `<img class="avatar" src="${src}">` : `<div class="avatar fallback" style="display:grid;place-items:center;font-size:18px;">${m.role==='user'?'🧑':'🤖'}</div>`;
  wrap.innerHTML = avStr + `<div class="bubble"></div>`;
  wrap.querySelector('.bubble').textContent = m.content;
  return wrap;
}
// 滚动到底部
function scrollBottom(){
  const box = document.getElementById('chatBox');
  requestAnimationFrame(()=>{ box.scrollTop = box.scrollHeight; });
}

/* ============ 发送消息 ============ */
async function sendMsg(){
  if(isAiTyping){ showToast('对方正在输入，请稍候'); return; }
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if(!text) return;
  if(!cfg.key){ showToast('请先在设置中填写 API Key'); toggleSheet(true); return; }

  // 加入我方消息
  const now = Date.now();
  messages.push({role:'user', content:text, time:now});
  saveMsgs();
  const box = document.getElementById('chatBox');
  const prev = messages[messages.length-2];
  if(!prev || now - prev.time > 60000) box.appendChild(timeTag(now));
  box.appendChild(buildMsg(messages[messages.length-1]));
  input.value = '';
  autoResize();
  scrollBottom();

  // 显示「正在输入」
  isAiTyping = true;
  document.getElementById('sendBtn').disabled = true;
  const typingNode = appendTyping();

  try{
    // 调用 AI（流式）
    const reply = await callAI(text);
    // 移除打字动画，渲染回复
    typingNode.remove();
    messages.push({role:'assistant', content:reply, time:Date.now()});
    saveMsgs();
    const t = messages[messages.length-1];
    const prev2 = messages[messages.length-2];
    if(Date.now() - t.time > 60000 || !prev2){} // 与上一条间隔小则不加时间戳
    box.appendChild(buildMsg(t));
    scrollBottom();
  }catch(err){
    typingNode.remove();
    showToast('请求失败：' + (err.message || err));
  }finally{
    isAiTyping = false;
    document.getElementById('sendBtn').disabled = false;
  }
}

// 「正在输入」节点
function appendTyping(){
  const box = document.getElementById('chatBox');
  const wrap = document.createElement('div');
  wrap.className = 'msg other';
  const src = cfg.otherAvatar;
  const avStr = src ? `<img class="avatar" src="${src}">` : `<div class="avatar fallback" style="display:grid;place-items:center;font-size:18px;">🤖</div>`;
  wrap.innerHTML = avStr + `<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  box.appendChild(wrap);
  scrollBottom();
  return wrap;
}

/* ============ 调用 OpenAI 通用格式 API（支持流式 SSE） ============ */
async function callAI(userText){
  // 构造带上下文的 messages：system + 最近 N 轮
  const ctx = [];
  if(cfg.prompt) ctx.push({role:'system', content:cfg.prompt});
  const recent = messages.slice(-cfg.memory*2); // 取最近的上下文（含刚发的user）
  recent.forEach(m => ctx.push({role:m.role, content:m.content}));

  const res = await fetch(cfg.api, {
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'Authorization':'Bearer ' + cfg.key
    },
    body: JSON.stringify({
      model: cfg.model,
      messages: ctx,
      stream: true
    })
  });

  if(!res.ok){
    const txt = await res.text().catch(()=>'');
    throw new Error(res.status + ' ' + txt.slice(0,120));
  }

  // 流式读取 SSE
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let full = '', buffer = '';

  while(true){
    const {done, value} = await reader.read();
    if(done) break;
    buffer += decoder.decode(value, {stream:true});
    const lines = buffer.split('\n');
    buffer = lines.pop() || ''; // 保留未完整的最后一行
    for(const line of lines){
      const l = line.trim();
      if(!l || !l.startsWith('data:')) continue;
      const data = l.slice(5).trim();
      if(data === '[DONE]') continue;
      try{
        const json = JSON.parse(data);
        const delta = json.choices?.[0]?.delta?.content;
        if(delta){ full += delta; updateLastBubble(full); }
      }catch(e){ /* 忽略非JSON分片 */ }
    }
  }
  // 非流式兼容：若流式未拿到内容，尝试整体解析
  if(!full && buffer){
    try{
      const json = JSON.parse(buffer);
      full = json.choices?.[0]?.message?.content || '';
    }catch(e){}
  }
  return full;
}
// 流式更新最后一条气泡（即「正在输入」那条）
function updateLastBubble(text){
  const box = document.getElementById('chatBox');
  const last = box.querySelector('.msg.other:last-child .bubble');
  if(last){
    last.innerHTML = '';
    last.textContent = text;
    scrollBottom();
  }
}

/* ============ 清空聊天 ============ */
function clearChat(){
  if(!confirm('确定清空全部聊天记录？')) return;
  messages = [];
  saveMsgs();
  document.getElementById('chatBox').innerHTML = '';
  showToast('已清空');
}

/* ============ 输入框自适应高度 + 回车发送 ============ */
const input = document.getElementById('msgInput');
function autoResize(){
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 110) + 'px';
}
input.addEventListener('input', autoResize);
input.addEventListener('keydown', function(e){
  // 回车发送；Shift+Enter 换行
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    sendMsg();
  }
});

loadCfg();
loadMsgs();
applyCfg();
renderAll();
// 首次使用提示
if(!cfg.key){
  setTimeout(()=>showToast('请点 ⚙️ 配置 API Key'), 600);
}
